name: Build Standalone App

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller app.spec --clean --noconfirm

      - name: Copy Assets
        run: |
          Copy-Item best.pt -Destination dist/run_app/
          # Create an empty database file for fresh deployments
          New-Item -Path "dist/run_app/garbage_stats.db" -ItemType File

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Smart_Conveyor_App
          path: dist/run_app/
